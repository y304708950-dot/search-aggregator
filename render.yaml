services:
  - type: web
    name: search-aggregator
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DISABLE_BROWSER
        value: "true"
      - key: SECRET_KEY
        generateValue: true